<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Panel Admin · FMIPA Connect</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0A1105">
  <link rel="icon" href="assets/img/logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
  <style>
    .adm { display: grid; grid-template-columns: minmax(0, 1fr); min-height: 100svh; }
    .adm-side, .adm-main { min-width: 0; }
    .adm-side { background: #070B03; border-bottom: 1px solid var(--line); padding: 16px 20px; display: flex; flex-direction: column; gap: 16px; }
    .adm-side nav { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }
    .adm-side nav button { flex-shrink: 0; display: flex; gap: 10px; align-items: center; padding: 10px 14px; border-radius: 12px; border: 0; background: none; color: var(--muted); cursor: pointer; font-weight: 600; font-size: .9rem; text-align: left; }
    .adm-side nav button svg { width: 18px; height: 18px; }
    .adm-side nav button[aria-current="page"] { background: rgba(223,247,91,.1); color: var(--lime); }
    .adm-side nav .badge-n { margin-left: auto; min-width: 22px; height: 22px; border-radius: 999px; background: var(--lime); color: var(--ink); font-size: .72rem; display: grid; place-items: center; padding: 0 6px; }
    .adm-side .who { font-size: .82rem; color: var(--muted); display: none; }
    .adm-main { padding: 24px 20px 60px; min-width: 0; }
    .adm-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; margin-bottom: 24px; }
    .adm-head h1 { font-size: clamp(2rem, 4vw, 2.8rem); }
    .kpis { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-bottom: 28px; }
    .row-list { display: grid; gap: 10px; }
    .row { display: grid; gap: 10px; padding: 16px 18px; border-radius: 16px; border: 1px solid var(--line); background: var(--glass); }
    .row.clickable { cursor: pointer; text-align: left; width: 100%; font: inherit; color: inherit; transition: border-color .2s; }
    .row.clickable:hover { border-color: var(--line-2); }
    .row-top { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; flex-wrap: wrap; }
    .row h3 { font-family: var(--sans); font-size: 1rem; font-weight: 600; }
    .row .sub { font-size: .82rem; color: var(--muted); }
    .row .acts { display: flex; gap: 6px; flex-wrap: wrap; }
    .row.urgent { border-color: rgba(255,138,122,.45); }
    .dl { display: grid; grid-template-columns: 140px 1fr; gap: 8px 14px; font-size: .9rem; margin: 16px 0; }
    .dl dt { color: var(--dim); }
    .dl dd { margin: 0; word-break: break-word; }

    .adm-side .nav-label { font-size: .68rem; letter-spacing: .16em; text-transform: uppercase; color: var(--dim); padding: 14px 14px 4px; flex-shrink: 0; align-self: center; }
    .ed-groups { display: grid; gap: 18px; padding-bottom: 90px; }
    .ed-group .form-section-title { font-size: 1.35rem; }
    .img-field { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
    .img-prev { width: 140px; aspect-ratio: 4/3; border-radius: 14px; border: 1px dashed var(--line-2); background: color-mix(in srgb, var(--text) 4%, transparent); display: grid; place-items: center; overflow: hidden; flex-shrink: 0; }
    .img-field.logo .img-prev { width: 96px; aspect-ratio: 1; background: #fff; }
    .img-prev img { width: 100%; height: 100%; object-fit: cover; }
    .img-field.logo .img-prev img { object-fit: contain; padding: 6px; }
    .img-prev span { display: grid; justify-items: center; gap: 4px; color: var(--dim); font-size: .74rem; }
    .img-acts { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; flex: 1; min-width: 180px; }
    .img-acts .hint { flex-basis: 100%; }
    .img-acts label.disabled { opacity: .6; pointer-events: none; }
    .presets { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 14px; }
    .preset { border: 1px solid var(--line); background: var(--bg-2); border-radius: 14px; padding: 8px; cursor: pointer; display: grid; gap: 6px; justify-items: center; color: var(--muted); }
    .preset:hover { border-color: var(--lime); color: var(--text); }
    .preset .sw { display: flex; border-radius: 8px; overflow: hidden; }
    .preset .sw i { width: 18px; height: 26px; display: block; }
    .preset small { font-size: .72rem; }
    .color-row { display: flex; gap: 8px; }
    .color-row input[type=color] { width: 52px; height: 46px; padding: 3px; border-radius: 12px; border: 1px solid var(--line); background: transparent; cursor: pointer; flex-shrink: 0; }
    .color-row input[type=text] { font-family: ui-monospace, Menlo, monospace; text-transform: uppercase; }
    .font-prev { margin-top: 18px; padding: 20px; border-radius: 16px; border: 1px solid var(--line); background: var(--bg-2); display: grid; gap: 8px; justify-items: start; }
    .font-prev h3 { font-size: 2rem; }
    .font-prev p { color: var(--muted); }
    .ed-list { display: grid; gap: 10px; }
    .ed-item { border: 1px solid var(--line); border-radius: 16px; background: color-mix(in srgb, var(--bg) 60%, transparent); }
    .ed-head, .ed-item > summary { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 12px 14px; }
    .ed-item > summary { cursor: pointer; list-style: none; }
    .ed-item > summary::-webkit-details-marker { display: none; }
    .ed-item > summary .ed-sum-r { display: flex; align-items: center; gap: 8px; }
    .ed-item > summary .ed-sum-r > svg { transition: transform .2s; color: var(--lime); }
    .ed-item[open] > summary .ed-sum-r > svg { transform: rotate(180deg); }
    .ed-head b, .ed-item > summary b { font-family: var(--serif); font-weight: 500; font-size: 1.05rem; }
    .ed-body { padding: 4px 14px 16px; border-top: 1px solid var(--line); }
    .ed-body .form-grid { margin-top: 12px; }
    .ed-body .ed-item { background: color-mix(in srgb, var(--text) 3%, transparent); }
    .row-btns { display: inline-flex; gap: 4px; }
    .ic-mini { width: 30px; height: 30px; border-radius: 8px; border: 1px solid var(--line); background: transparent; color: var(--muted); cursor: pointer; font-size: .9rem; }
    .ic-mini:hover:not(:disabled) { border-color: var(--lime); color: var(--lime); }
    .ic-mini:disabled { opacity: .3; cursor: default; }
    .ic-mini.del:hover { border-color: var(--danger); color: var(--danger); }
    .str-list { display: grid; gap: 8px; justify-items: start; }
    .str-row { display: flex; gap: 8px; align-items: center; width: 100%; }
    .str-row input { flex: 1; }
    .save-bar { position: fixed; left: 50%; bottom: 18px; transform: translate(-50%, 140%); z-index: 80; width: min(94vw, 680px); display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; padding: 12px 14px 12px 18px; border-radius: 18px; background: var(--bg-3); border: 1px solid var(--line-2); box-shadow: var(--shadow); transition: transform .3s; font-size: .88rem; }
    .save-bar.show { transform: translate(-50%, 0); }
    .save-bar > span { display: flex; gap: 8px; align-items: center; color: var(--warn); }
    .save-bar > div { display: flex; gap: 8px; }
    .ed-reset { margin: 10px 0 100px; }
    @media (min-width: 960px) { .save-bar { left: calc(50% + 125px); } .adm-side .nav-label { align-self: auto; } }
    .login-box { max-width: 440px; margin: 12vh auto; padding: 0 20px; }
    @media (min-width: 960px) {
      .adm { grid-template-columns: 250px minmax(0, 1fr); }
      .adm-side { position: sticky; top: 0; height: 100svh; border-bottom: 0; border-right: 1px solid var(--line); padding: 24px 16px; }
      .adm-side nav { flex-direction: column; overflow: visible; }
      .adm-side .who { display: block; margin-top: auto; }
      .adm-main { padding: 40px 48px 80px; }
      .kpis { grid-template-columns: repeat(4, 1fr); }
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script src="assets/js/config.js"></script>
  <script src="assets/js/org.js"></script>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/ui.js"></script>
  <script src="assets/js/admin-situs.js"></script>
  <script src="assets/js/admin.js"></script>
</body>
</html>
