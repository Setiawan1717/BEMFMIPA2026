<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Kaushan+Script&family=Poppins:wght@500;600;700&display=block" rel="stylesheet">
<style>
:root{--cream:#f4efa2;--cream2:#fbf8d6;--g1:#2e5a1c;--g2:#1c3a12;--g3:#11250b;}
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1920px;overflow:hidden;background:var(--g2);font-family:Poppins,sans-serif}
.stage{position:relative;width:1080px;height:1920px;
 background:radial-gradient(ellipse 80% 60% at 50% 45%,#3a6b24 0%,var(--g1) 35%,var(--g2) 70%,var(--g3) 100%);}
svg.bg{position:absolute;inset:0}
.title{position:absolute;left:0;right:0;top:760px;text-align:center;font-family:'Kaushan Script',cursive;
 color:var(--cream);font-size:150px;line-height:1.05;transform:rotate(-3deg);
 text-shadow:0 6px 0 rgba(0,0,0,.25),0 14px 40px rgba(0,0,0,.35)}
.tag{position:absolute;top:150px;left:50%;transform:translateX(-50%);border:3px solid var(--cream);color:var(--cream);
 padding:14px 36px;border-radius:999px;font-weight:600;font-size:30px;letter-spacing:6px}
.sub{position:absolute;top:1130px;left:0;right:0;text-align:center;color:var(--cream2);font-size:38px;font-weight:500;opacity:.92;line-height:1.45}
.sub b{color:var(--cream);font-weight:700}
.cta{position:absolute;bottom:170px;left:50%;transform:translateX(-50%);background:var(--cream);color:var(--g2);
 padding:22px 48px;border-radius:999px;font-weight:700;font-size:32px;white-space:nowrap;box-shadow:0 10px 30px rgba(0,0,0,.35)}
</style></head><body><div class="stage">

</svg>

</div></body></html>
